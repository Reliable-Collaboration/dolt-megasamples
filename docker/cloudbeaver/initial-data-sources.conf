{
  "folders": {},
  "connections": {
    "dolt-demo": {
      "provider": "mysql",
      "driver": "mysql8",
      "name": "dolt-megasamples (read-only)",
      "description": "Connected as demo: SELECT and SHOW VIEW only, no write privilege anywhere.",
      "save-password": true,
      "configuration": {
        "host": "dolt",
        "port": "3306",
        "database": "sakila",
        "url": "jdbc:mysql://dolt:3306/sakila",
        "type": "dev",
        "auth-model": "native",
        "properties": {
          "allowPublicKeyRetrieval": "true",
          "useSSL": "false"
        },
        "user": "demo",
        "password": "${DEMO_PASSWORD:demo}"
      }
    },
    "dolt-admin": {
      "provider": "mysql",
      "driver": "mysql8",
      "name": "dolt-megasamples (full access)",
      "description": "Connected as admin: ALL PRIVILEGES. Anything you change here, stays changed.",
      "save-password": true,
      "configuration": {
        "host": "dolt",
        "port": "3306",
        "database": "sakila",
        "url": "jdbc:mysql://dolt:3306/sakila",
        "type": "dev",
        "auth-model": "native",
        "properties": {
          "allowPublicKeyRetrieval": "true",
          "useSSL": "false"
        },
        "user": "admin",
        "password": "${ADMIN_PASSWORD:admin}"
      }
    },
    "doltgres-demo": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "DoltgreSQL (read-only)",
      "description": "DoltgreSQL 1.3.1 (pinned) over the PostgreSQL protocol, as demo: SELECT on every sample table.",
      "save-password": true,
      "configuration": {
        "host": "doltgres",
        "port": "5432",
        "database": "sakila",
        "url": "jdbc:postgresql://doltgres:5432/sakila",
        "type": "dev",
        "auth-model": "native",
        "provider-properties": {
          "@dbeaver-show-non-default-db@": "true"
        },
        "user": "demo",
        "password": "${DEMO_PASSWORD:demo}"
      }
    },
    "doltgres-admin": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "DoltgreSQL (full access)",
      "description": "DoltgreSQL 1.3.1 (pinned) as admin (superuser). Anything you change here, stays changed.",
      "save-password": true,
      "configuration": {
        "host": "doltgres",
        "port": "5432",
        "database": "sakila",
        "url": "jdbc:postgresql://doltgres:5432/sakila",
        "type": "dev",
        "auth-model": "native",
        "provider-properties": {
          "@dbeaver-show-non-default-db@": "true"
        },
        "user": "admin",
        "password": "${ADMIN_PASSWORD:admin}"
      }
    }
  }
}
