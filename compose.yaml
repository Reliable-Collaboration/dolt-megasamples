# Every service carries a mem_limit. WSL2 gave this host 15.5 GB and ran out of it while the
# experiment was running, because nothing anywhere was bounded -- not the loads, not the consoles.
# A container with no limit can see the whole VM, so one process going wide takes the machine down
# rather than failing on its own. These figures are chosen so both repositories' console stacks can
# be up together in about 7.5 GB; a timed run needs its consoles down regardless, since a server
# reading the data competes with the thing being measured.
# The Dolt side of the experiment: the same 21 sample databases, the same two accounts, the same
# four consoles -- on different ports, so both stacks can run at once and be compared side by side.
#
#   docker compose up -d           Dolt plus its UIs and landing page
#   docker compose down            all of it down again
#   docker compose up -d dolt      just the database
#
# Ports are deliberately one range above sql-megasamples, which uses 3306 and 8080-8084:
#
#   3307  Dolt (MySQL wire protocol)        8090  landing page
#   8091  phpMyAdmin   8092  Adminer        8093  DbGate      8094  CloudBeaver
#   8095  Dolt Workbench (+ 9002, its GraphQL API, which the browser calls directly)
#
# Everything binds to 127.0.0.1. Images are pinned by digest.
#
# `data/dolt` is written by scripts/load_dolt.py before this stack ever starts, so the image's
# /docker-entrypoint-initdb.d hook -- which only fires on an empty data directory -- never runs.
# The `dolt-init` service applies the accounts instead, on every `up`, idempotently.

name: dolt-megasamples

services:
  dolt:
    image: dolthub/dolt-sql-server@sha256:38d5e900583267f35e36ad738e13f202e62860b351aa4c088dceaf7dbaed7ab6
    mem_limit: 1536m
    container_name: doltsamples-dolt
    ports: ["127.0.0.1:3307:3306"]
    environment:
      DOLT_ROOT_PASSWORD: ${DOLT_ROOT_PASSWORD:-root}
      DOLT_ROOT_HOST: "%"
    # compose.override.yaml, written by scripts/stack_config.py on every `make up`, mounts each
    # repository of the chosen load shape (make up SERVE=rowcommit) at /var/lib/dolt/<db>: the timed
    # runner keeps them one level deeper than the server looks, and Dolt 2.3's config cannot name
    # paths. Without the override, the one-commit loads below are served as they are.
    volumes:
      - ./data/dolt:/var/lib/dolt
    # No `command:`. The image's entrypoint already starts `dolt sql-server` with its own --host,
    # and its WORKDIR is /var/lib/dolt, which is where the volume is mounted. Adding flags here got
    # "multiple values provided for `host'" and the server printed usage instead of starting.
    healthcheck:
      # The port, not the CLI. `dolt sql -q` answers from the data directory whether or not the
      # server is listening, so a CLI healthcheck goes green immediately and dolt-init then fails
      # with "Can't connect to MySQL server on 'dolt:3306'". bash's /dev/tcp tests the real thing.
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3306' 2>/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # One-shot: creates `demo` and `admin` once the server answers, then exits. Uses the MySQL client
  # from the megasamples image because Dolt's own image ships no client.
  dolt-init:
    image: ${MEGASAMPLES_MYSQL_IMAGE:-sql-megasamples-mysql:dev}
    mem_limit: 512m
    container_name: doltsamples-init
    depends_on: { dolt: { condition: service_healthy } }
    volumes:
      - ./docker/dolt/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    environment:
      DOLT_ROOT_PASSWORD: ${DOLT_ROOT_PASSWORD:-root}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    restart: "no"

  # ============================================================================================
  # PINNED: DoltgreSQL 1.3.1 by digest -- the build every DoltgreSQL number was measured against
  # (scripts/pairs.py carries the same digest; knowledge/decisions/doltgresql-version-pin.md says
  # how to undo the pin: change both, rerun the DoltgreSQL units). Serves the one-shot loads
  # (data/doltgres-oneshot, one repository per database) on 5433, one above sql-megasamples' 5432.
  # ============================================================================================
  doltgres:
    image: dolthub/doltgresql@sha256:6c85cb1f35beabf47f094336a420255130b841b1645f36d79ef046276af36851
    mem_limit: 1536m
    container_name: doltsamples-doltgres
    ports: ["127.0.0.1:5433:5432"]
    environment:
      DOLTGRES_PASSWORD: ${DOLTGRES_PASSWORD:-doltsamples}
    volumes:
      - ./data/doltgres-oneshot:/var/lib/doltgres
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$DOLTGRES_PASSWORD psql -X -h 127.0.0.1 -U postgres -d postgres -tAc 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  doltgres-init:
    image: dolthub/doltgresql@sha256:6c85cb1f35beabf47f094336a420255130b841b1645f36d79ef046276af36851
    mem_limit: 256m
    container_name: doltsamples-doltgres-init
    depends_on: { doltgres: { condition: service_healthy } }
    volumes:
      - ./docker/doltgres/init.sh:/init.sh:ro
      - ./docker/doltgres/init.sql:/init.sql:ro
    entrypoint: ["sh", "/init.sh"]
    environment:
      DOLTGRES_PASSWORD: ${DOLTGRES_PASSWORD:-doltsamples}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    restart: "no"
  # DoltLite has no server: the files of the one-shot loads (data/doltlite-oneshot/<db>.doltlite)
  # and the doltlite shell, in the image `make lite-image` builds from the pinned v0.50.9 packages.
  # Use it with `docker exec -it doltsamples-doltlite doltlite /data/sakila.doltlite`, or copy a
  # file out; no web console reads a DoltLite file, since it is not SQLite pages.
  doltlite:
    image: doltsamples-doltlite:0.50.9
    mem_limit: 512m
    container_name: doltsamples-doltlite
    volumes:
      - ./data/doltlite-oneshot:/data
    restart: unless-stopped
  console:
    image: nginx@sha256:3bcf852aed06467cf075c6105892e4d5a6ebbbafa0ce22d35062db9e90ddef4c
    mem_limit: 32m
    container_name: doltsamples-console
    ports: ["127.0.0.1:8090:80"]
    volumes:
      - ./docker/console:/usr/share/nginx/html:ro
    depends_on: { dolt: { condition: service_healthy } }
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin@sha256:20fa6f724ba77d41abc25b1aeb4d97692ce344c7ace305594e57c5893f60f0f7
    mem_limit: 256m
    container_name: doltsamples-phpmyadmin
    ports: ["127.0.0.1:8091:80"]
    environment:
      PMA_HOST: dolt
      PMA_PORT: "3306"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      UPLOAD_LIMIT: 256M
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on: { dolt: { condition: service_healthy } }
    restart: unless-stopped

  adminer:
    image: adminer@sha256:f1e2ba27b10a565ac77b2d8555d803be4ddb3232f4216dcf0ea85bcd8f2f1343
    mem_limit: 160m
    container_name: doltsamples-adminer
    ports: ["127.0.0.1:8092:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: dolt
    depends_on: { dolt: { condition: service_healthy } }
    restart: unless-stopped

  dbgate:
    image: dbgate/dbgate@sha256:14fce4ece52df514e0d320dc82cbfbca5e8f18f98464a6389b1c126f783a6b7e
    mem_limit: 320m
    container_name: doltsamples-dbgate
    ports: ["127.0.0.1:8093:3000"]
    environment:
      CONNECTIONS: demo,admin,pgdemo,pgadmin
      LABEL_demo: dolt-megasamples (read-only)
      SERVER_demo: dolt
      PORT_demo: "3306"
      USER_demo: demo
      PASSWORD_demo: ${DEMO_PASSWORD:-demo}
      ENGINE_demo: mysql@dbgate-plugin-mysql
      LABEL_admin: dolt-megasamples (full access)
      SERVER_admin: dolt
      PORT_admin: "3306"
      USER_admin: admin
      PASSWORD_admin: ${ADMIN_PASSWORD:-admin}
      ENGINE_admin: mysql@dbgate-plugin-mysql
      LABEL_pgdemo: DoltgreSQL (read-only)
      SERVER_pgdemo: doltgres
      PORT_pgdemo: "5432"
      USER_pgdemo: demo
      PASSWORD_pgdemo: ${DEMO_PASSWORD:-demo}
      ENGINE_pgdemo: postgres@dbgate-plugin-postgres
      LABEL_pgadmin: DoltgreSQL (full access)
      SERVER_pgadmin: doltgres
      PORT_pgadmin: "5432"
      USER_pgadmin: admin
      PASSWORD_pgadmin: ${ADMIN_PASSWORD:-admin}
      ENGINE_pgadmin: postgres@dbgate-plugin-postgres
    depends_on: { dolt: { condition: service_healthy }, doltgres: { condition: service_healthy } }
    restart: unless-stopped

  # Dolt's own browsing product. The other four consoles see Dolt as a MySQL server and so cannot
  # show what makes it Dolt -- branches, commits, diffs between them. This one can.
  #
  # It is the only console here that cannot be preconfigured: it reads no connection from the
  # environment (`GRAPHQLAPI_URL` is the only variable its bundle looks at, and that is where the
  # browser finds its own API, not the database). The connection is entered once in the UI; the
  # landing page states exactly what to type. Its GraphQL server runs inside this container and
  # reaches the database at `dolt:3306` on the compose network, while the browser reaches the
  # GraphQL server on the published 9002.
  workbench:
    image: dolthub/dolt-workbench@sha256:acba96fe224c7be44ce1c5f283691230608fdf917167e4e5548f6669f2c23855
    mem_limit: 640m
    container_name: doltsamples-workbench
    ports:
      - "127.0.0.1:8095:3000"
      - "127.0.0.1:9002:9002"
    environment:
      GRAPHQLAPI_URL: http://127.0.0.1:9002/graphql
    volumes:
      # the saved connections (both accounts on Dolt and on DoltgreSQL, one per served DoltLite
      # file), written by scripts/stack_config.py on every `make up`; the Workbench adds to the same file
      - ./docker/workbench/store:/app/graphql-server/store
      # the DoltLite files, one saved connection each: the Workbench's bundled DoltLite opens
      # them in its own process (several processes may share a file; one writer at a time)
      - ./data/doltlite-oneshot:/data/doltlite
    depends_on: { dolt: { condition: service_healthy }, doltgres: { condition: service_healthy } }
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver@sha256:3b4bf82287cf4febe0d335873f1346a01100f3951d266cd6a78c27fe30429cbc
    mem_limit: 640m
    container_name: doltsamples-cloudbeaver
    ports: ["127.0.0.1:8094:8978"]
    environment:
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
      CLOUDBEAVER_APP_READ_ONLY_CONNECTION_INFO: "true"
      CLOUDBEAVER_SYSTEM_VARIABLES_RESOLVING_ENABLED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/cloudbeaver/.cloudbeaver.auto.conf:/opt/cloudbeaver/conf/.cloudbeaver.auto.conf:ro
      - ./docker/cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro
    depends_on: { dolt: { condition: service_healthy } }
    restart: unless-stopped
